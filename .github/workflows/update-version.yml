name: Update Atomikos version
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
# the job pushes the README update back to the repository
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          VERSION=$(curl -sf --compressed https://www.atomikos.com/Main/WebHome | grep -oP 'Latest version \K\d+(\.\d+)+' | head -n 1 || true)
          # never write an empty or garbled version: fail the run so it shows up instead
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::Could not find the latest Atomikos version on atomikos.com (got '${VERSION}')"
            exit 1
          fi
          sed -i "s/<!--VERSION-->.*<!--\/VERSION-->/<!--VERSION-->${VERSION}<!--\/VERSION-->/" README.md
          # move the version the project builds with forward to the latest release - never back:
          # the POM may already be ahead (e.g. 6.0.121-SNAPSHOT, for a feature not released yet),
          # and a snapshot is replaced only by its own release or a later one
          CURRENT=$(grep -oP '<atomikos.version>\K[^<]+' pom.xml || true)
          [ -n "$CURRENT" ] || { echo "::error::No <atomikos.version> property found in pom.xml"; exit 1; }
          BASE=${CURRENT%-SNAPSHOT}
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }
          if newer "$VERSION" "$BASE" || { [ "$VERSION" = "$BASE" ] && [ "$CURRENT" != "$BASE" ]; }; then
            sed -i "s#<atomikos.version>.*</atomikos.version>#<atomikos.version>${VERSION}</atomikos.version>#" pom.xml
          else
            echo "pom.xml keeps atomikos.version ${CURRENT} (latest release: ${VERSION})"
          fi
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git diff --quiet README.md pom.xml || (git add README.md pom.xml && git commit -m "Update Atomikos version" && git push)
